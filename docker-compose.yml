services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  collector:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    command: ["python", "-m", "src.ingestion"]

volumes:
  db_data:
