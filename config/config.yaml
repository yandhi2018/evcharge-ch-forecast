  weather:
    provider: "open-meteo"
    archive_base_url: "https://archive-api.open-meteo.com/v1/archive"
    forecast_base_url: "https://api.open-meteo.com/v1/forecast"
    hourly_variables:
      - temperature_2m
      - precipitation
      - snowfall
      - wind_speed_10m
    publication_delay_days: 3
    backfill_start_date: "2026-07-16"

